<?xml version="1.0" encoding="UTF-8"?>
<!--
  StickyTodo App Icon (1024×1024 master)
  ────────────────────────────────────────
  Design concept:
    - A slightly tilted sticky note (the "Sticky" in StickyTodo)
    - Two checked todo lines on the note (the "Todo")
    - A curled corner at the bottom-right reinforces the paper metaphor
    - Squircle-style rounded background aligned with macOS 11+ icon grid
      (visual payload fits within the 80% safe area)

  Source of truth. All PNG/ICNS/favicon artifacts are derived from this file
  by scripts/generate-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-label="StickyTodo application icon">
  <title>StickyTodo</title>
  <desc>A tilted yellow sticky note with two checked todo items and a curled corner.</desc>

  <defs>
    <!-- Background: warm gradient to add depth without clashing with the note -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFF6D6"/>
      <stop offset="100%" stop-color="#F6B93B"/>
    </linearGradient>

    <!-- Note body: classic sticky-note yellow with subtle top-to-bottom lift -->
    <linearGradient id="noteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE27A"/>
      <stop offset="100%" stop-color="#FFC83D"/>
    </linearGradient>

    <!-- Folded corner gets a slightly darker gradient to read as a back-face -->
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E6A82B"/>
      <stop offset="100%" stop-color="#B37F18"/>
    </linearGradient>

    <!-- Soft shadow under the note to lift it off the background -->
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tiny inner highlight along the top edge of the note -->
    <linearGradient id="noteHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ───────────── Rounded-square background ───────────── -->
  <!-- 180 radius on a 1024 canvas ≈ macOS Big Sur squircle proportion -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bgGrad)"/>

  <!-- ───────────── The sticky note ─────────────
       Coordinates are designed around the 1024 canvas with ~12% safe-area
       padding on all sides. A slight (-6°) rotation keeps it playful. -->
  <g transform="translate(512 512) rotate(-6) translate(-360 -360)" filter="url(#noteShadow)">

    <!-- Main paper body (820×720, rounded corners except bottom-right which
         will be visually overridden by the fold). -->
    <path d="
      M 40 0
      H 680
      Q 720 0 720 40
      V 560
      L 560 720
      H 40
      Q 0 720 0 680
      V 40
      Q 0 0 40 0
      Z"
      fill="url(#noteGrad)" stroke="#B37F18" stroke-width="4" stroke-linejoin="round"/>

    <!-- Top highlight to suggest light hitting the paper -->
    <path d="
      M 40 0
      H 680
      Q 720 0 720 40
      V 90
      H 0
      V 40
      Q 0 0 40 0 Z"
      fill="url(#noteHighlight)"/>

    <!-- ───── Folded corner (bottom-right) ─────
         Triangle filled with the back-face gradient so the note reads as 3D. -->
    <path d="
      M 560 720
      L 720 560
      L 720 700
      Q 720 720 700 720
      Z"
      fill="url(#foldGrad)" stroke="#8A5F10" stroke-width="3" stroke-linejoin="round"/>
    <!-- Thin crease line at the fold boundary -->
    <path d="M 560 720 L 720 560" stroke="#8A5F10" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- ───── Todo list rows ─────
         Three rows: two checked (with green ✓), one pending (with empty box).
         Row vertical centers: 230, 380, 530. Row height ~ 90px. -->

    <!-- Row 1: checked -->
    <g transform="translate(80 190)">
      <!-- check box -->
      <rect x="0" y="0" width="90" height="90" rx="18" ry="18" fill="#22C55E" stroke="#1F7A3B" stroke-width="4"/>
      <!-- check mark -->
      <path d="M 22 48 L 40 66 L 72 28" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- strike-through line indicating completion -->
      <rect x="120" y="36" width="440" height="18" rx="9" ry="9" fill="#1F2937" opacity="0.85"/>
      <rect x="120" y="36" width="440" height="18" rx="9" ry="9" fill="none" stroke="#1F2937" stroke-width="2" opacity="0.3"/>
    </g>

    <!-- Row 2: checked -->
    <g transform="translate(80 340)">
      <rect x="0" y="0" width="90" height="90" rx="18" ry="18" fill="#22C55E" stroke="#1F7A3B" stroke-width="4"/>
      <path d="M 22 48 L 40 66 L 72 28" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="120" y="36" width="360" height="18" rx="9" ry="9" fill="#1F2937" opacity="0.85"/>
    </g>

    <!-- Row 3: pending (empty box), slightly shorter to fit above the fold -->
    <g transform="translate(80 490)">
      <rect x="0" y="0" width="90" height="90" rx="18" ry="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="5" opacity="0.9"/>
      <rect x="120" y="36" width="300" height="18" rx="9" ry="9" fill="#1F2937" opacity="0.55"/>
    </g>

  </g>
</svg>
