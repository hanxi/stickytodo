# Reusable workflow that builds every stickytodo release artifact and, when
# requested, publishes them as a GitHub Release.
#
# Callers: .github/workflows/release-tag.yml (for v* tags) and
# .github/workflows/release-branch.yml (for manual branch pre-releases).
#
# Jobs (fan-out):
#   build-web        → web/dist artifact     (ubuntu-latest)
#   build-server     → 7 cross-compiled bins (ubuntu-latest, needs build-web)
#   build-mac-dmg    → universal .dmg        (macos-26 + Xcode 26.4.1, needs build-web)
#   build-win-client → Win32 portable zip +
#                      Inno Setup .exe       (windows-2022 + vcpkg + Inno Setup)
#   build-docker     → multi-arch image push (ubuntu-latest, needs build-web)
#   publish-release  → gh release upload     (ubuntu-latest, needs all above)
#
# Inputs let the caller pick the artifact version string, the git tag the
# release will be attached to, and whether the release is a pre-release.
name: build-all

on:
  workflow_call:
    inputs:
      version:
        description: 'Semantic version baked into artifact filenames (e.g. v1.2.3 or branch-main)'
        required: true
        type: string
      tag_name:
        description: 'Git tag the GitHub Release will be bound to'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as pre-release'
        required: false
        type: boolean
        default: false
      docker_image:
        description: 'Docker image name (e.g. docker.io/hanxi/stickytodo). Empty = skip docker push.'
        required: false
        type: string
        default: 'docker.io/hanxi/stickytodo'
      tag_latest:
        description: 'Also push :latest tag to the Docker registry'
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: write   # required for softprops/action-gh-release to upload assets

jobs:
  # -------------------------------------------------------------------------
  # 1. Build the web SPA once. Cached artifact is consumed by server + mac.
  # -------------------------------------------------------------------------
  build-web:
    name: Build web (SPA → server/internal/webui/dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Build web
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-web.sh

      # The embed target lives at server/internal/webui/dist/ — upload it so
      # the server + mac jobs can download and embed without re-building.
      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist/
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2. Cross-compile the 7 server binaries via scripts/package-server.sh.
  # -------------------------------------------------------------------------
  build-server:
    name: Build server binaries (7 platforms)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist/

      - name: Package server binaries
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-server.sh

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: server-bins
          path: |
            dist/server/stickytodo-server-*
            dist/server/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Mac universal DMG. Must run on macOS for xcodebuild + codesign.
  #
  # Runner / Xcode policy
  # ---------------------
  # 关键前提（有官方文档支撑，别再假设了）：
  #
  # (a) `macos-latest` **YAML 标签当前指向 macos-15-arm64**（macOS 15.7.x
  #     Sonoma 的继任），macos-15-arm64 runner 上预装的 Xcode 基本是 16.x
  #     系列，**完全没有装 Xcode 26.x**。这是 runner-images 官方主 README
  #     的 "Available Images" 表明确声明的（见
  #     https://github.com/actions/runner-images?tab=readme-ov-file#available-images
  #     "macOS 15 Arm64 | arm64 | `macos-latest`, `macos-15`, or `macos-15-xlarge`"）。
  #     过去这个 job 用 `runs-on: macos-latest` + 把源码升级到 macOS 26
  #     API 后能编过，只是因为本身不依赖 26.x SDK。一旦要和维护者本机的
  #     Xcode 26.4 对齐 SDK，**必须切到 macos-26 runner**——macos-latest
  #     根本没这张 SDK。
  #
  # (b) 维护者本机用 Xcode 26.4（macOS 26.4 Tahoe），对应 SDK macosx26.4。
  #     CI 目标就是产出同 SDK 的 DMG，否则 SwiftUI `.buttonStyle(.bordered)`
  #     等控件的默认填充基色会跨 SDK 漂移（实测现象：CI 产 DMG 的加号按钮
  #     白底，本机 Debug 灰底）。源码层已经在 Views/StickyView.swift 显式
  #     叠了 `.tint(.secondary)` + `.controlSize(.small)` 做兜底，但这只是
  #     第二道防线——锁 SDK 才是根本解。
  #
  # (c) runner `macos-26`（arm64 GA 标签，与 `macos-26-xlarge` 同指向
  #     macOS 26 Tahoe arm64 镜像）的 Xcode 完整预装列表（截至本注释
  #     写就时，来自 runner-images macos-26-arm64-Readme "### Xcode" 表）：
  #         26.5 (beta)    /Applications/Xcode_26.5_beta_2.app
  #         26.4.1         /Applications/Xcode_26.4.1.app  (symlink: Xcode_26.4.app)
  #         26.3           /Applications/Xcode_26.3.app
  #         26.2 (default) /Applications/Xcode.app
  #         26.1.1         /Applications/Xcode_26.1.1.app
  #         26.0.1         /Applications/Xcode_26.0.1.app
  #     这里的 `(default)` 是说 runner 启动时 `xcode-select -p` 指向 26.2
  #     —— **不是**本文件之前误写的"macos-latest 默认 26.2"。
  #
  # 综合以上三点，当前策略：
  #
  #   1) `runs-on: macos-26`（arm64 GA），**不用 `macos-latest`**，因为后者
  #      指向 macos-15 没有 26.x SDK
  #   2) setup-xcode@v1 显式切换到 `26.4.1`（字面量；setup-xcode 其实支持
  #      SemVer 如 `26.4`，但字面量最零歧义，升级时也更醒目）
  #
  # 升级方法：见 AGENTS.md §7.7 的"如何升级 / 调整锁定的 Xcode 版本"。
  # -------------------------------------------------------------------------
  build-mac-dmg:
    name: Build macOS universal DMG
    runs-on: macos-26
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist/

      # 锁 Xcode 到 26.4.1（与本机 Xcode 26.4 同 macosx26.4 SDK）。字面量
      # 必须存在于当前 macos-26 runner 预装列表里；升级前先去
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      # 的 "### Xcode" 表核对。
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Verify Xcode selection
        run: |
          echo "xcode-select -p → $(xcode-select -p)"
          xcodebuild -version

      # create-dmg gives us a prettier Applications-symlink DMG. If brew fails
      # the script transparently falls back to hdiutil.
      - name: Install create-dmg
        run: brew install create-dmg || true

      - name: Package mac client
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/package-mac-client.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            dist/mac-client/stickytodo-*-macos-universal.dmg
            dist/mac-client/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Windows native client — Win32 + C++/WinRT + Direct2D.
  #
  # Runner / toolchain policy
  # -------------------------
  # * `runs-on: windows-2022` (Windows Server 2022 / MSVC 2022 images). We
  #   deliberately don't use `windows-latest` because that label migrates
  #   to new Windows versions on GitHub's own schedule — and our client
  #   targets Windows 10 20H1+, so we want the *oldest-still-supported*
  #   runner as our build baseline. Binaries built on Server 2022 still
  #   run on Windows 10 / 11 client editions without issue.
  # * vcpkg is pre-installed on windows-2022 at C:\vcpkg and exposed via
  #   the VCPKG_INSTALLATION_ROOT env var. We copy that into VCPKG_ROOT
  #   because CMakePresets.json references `$env{VCPKG_ROOT}` (the vcpkg
  #   convention). Alternatively we could use
  #   microsoft/setup-msbuild + a custom vcpkg checkout, but the preinstalled
  #   one is already warm-cached and saves ~3 min per run.
  # * Inno Setup 6 is pre-installed on windows-2022 at
  #   `C:\Program Files (x86)\Inno Setup 6\ISCC.exe` (via the runner's
  #   chocolatey bootstrap). package-win-client.sh auto-discovers that
  #   path — so the step below does not need to pass ISCC explicitly.
  # * bash (Git Bash) is pre-installed; `shell: bash` on windows-2022
  #   picks it up automatically.
  # -------------------------------------------------------------------------
  build-win-client:
    # Matrix expansion: windows-2022 runner × [x64, arm64]. Both legs run
    # in parallel; `fail-fast: false` lets the arm64 leg finish even if x64
    # trips an architecture-independent bug (and vice versa) so maintainers
    # see the full picture, not just the first error.
    #
    # arm64 is a CROSS-COMPILE from an x64 host: MSVC's cross tools produce
    # the arm64 PE, but we cannot execute the resulting binary on the build
    # machine, so `package-win-client.sh` unconditionally skips ctest for
    # the arm64 arch (the codec / models tests under src/tests/ exercise
    # pure C++ logic that is architecture-independent, so x64's passing
    # test run already guarantees correctness across both architectures).
    name: Build Windows client (${{ matrix.arch }} zip + Inno Setup installer)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Windows client doesn't embed the Web UI (it's a native Win32 app, not
    # a web-hosting server), so it doesn't need the web-dist artifact —
    # omit `needs: build-web` to let it start in parallel.
    steps:
      - uses: actions/checkout@v4

      # Activate the matching MSVC dev environment BEFORE anything else
      # reads PATH. ilammy/msvc-dev-cmd's `arch` input accepts the vcvarsall
      # keywords directly:
      #   x64    → `amd64`       (native x64-host, x64-target build)
      #   arm64  → `amd64_arm64` (x64-host, arm64-target CROSS build)
      # `amd64_arm64` swaps in MSVC's arm64 codegen while keeping the host
      # toolchain as amd64 — cl.exe still runs natively on the x64 runner,
      # it just emits arm64 PE output. This is the only supported way to
      # build arm64 binaries on GitHub's x64 runners today (they don't
      # offer a public arm64 Windows runner yet; when they do, we can
      # switch the arm64 matrix leg to `runs-on: windows-2022-arm64` +
      # `arch: arm64` for a native build and drop the cross-compile path).
      #
      # Rationale for needing this step at all — see the long note above
      # the Activate step in pre-matrix git history: windows-2022 runners
      # have mingw64's g++ early on PATH and CMake will pick it up unless
      # the MSVC environment has been activated first.
      - name: Activate MSVC dev environment (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          # windows-2022 ships Inno Setup 6 pre-installed at the standard
          # Program Files (x86) location, but we guard just in case the
          # runner image rotates the tool out. choco install is a no-op
          # when the package is already present.
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          } else {
            Write-Host 'Inno Setup 6 already installed.'
          }

      - name: Export VCPKG_ROOT
        shell: bash
        # The windows-2022 image bootstraps vcpkg and exposes its path via
        # VCPKG_INSTALLATION_ROOT. CMakePresets.json references VCPKG_ROOT
        # (the upstream-vcpkg convention), so we mirror it into the shell
        # env and into GITHUB_ENV so later bash / pwsh steps see it too.
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "Using VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"

      - name: Package Windows client (${{ matrix.arch }})
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        # ARCH is consumed by scripts/package-win-client.sh — it picks the
        # matching CMake preset (release-arm64 vs release), the matching
        # vcpkg triplet (arm64-windows vs x64-windows), the matching iscc
        # /D defines (AppArch=arm64 vs AppArch=x64), and the matching
        # artifact filenames (stickytodo-<ver>-windows-<arch>.zip +
        # stickytodo-setup-<ver>-<arch>.exe).
        run: bash scripts/package-win-client.sh

      - name: Upload Windows artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          # Per-arch artifact names so the two matrix legs never collide at
          # upload time. publish-release below downloads both names.
          name: win-client-${{ matrix.arch }}
          path: |
            dist/win-client/stickytodo-*-windows-${{ matrix.arch }}.zip
            dist/win-client/stickytodo-setup-*-${{ matrix.arch }}.exe
            dist/win-client/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 5. Detect DOCKERHUB_USERNAME up-front in a tiny dedicated job so we can
  #    branch on it using `if: needs.detect-docker-creds.outputs.have == ...`.
  #    GitHub Actions does NOT evaluate `secrets.*` inside a job-level `if:`,
  #    and we want the expensive QEMU-based multi-arch build to be skipped
  #    entirely (not run with push=false) when no credentials are available —
  #    otherwise every branch-dispatch from a fork wastes ~10 min of CI time
  #    emulating armv7 for an image that is never saved anywhere.
  # -------------------------------------------------------------------------
  detect-docker-creds:
    name: Detect Docker Hub credentials
    runs-on: ubuntu-latest
    if: ${{ inputs.docker_image != '' }}
    outputs:
      have: ${{ steps.check.outputs.have }}
    steps:
      - name: Check DOCKERHUB_USERNAME
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials available → build-docker will run."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME absent → build-docker will be SKIPPED (not built, not pushed)."
          fi

  # -------------------------------------------------------------------------
  # 6. Multi-arch Docker image — QEMU + buildx handle amd64/arm64/armv7.
  #    Only runs when credentials exist (see detect-docker-creds).
  # -------------------------------------------------------------------------
  build-docker:
    name: Build & push multi-arch Docker image
    runs-on: ubuntu-latest
    needs: [build-web, detect-docker-creds]
    if: needs.detect-docker-creds.outputs.have == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker login (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compose tag list: always ${image}:${version}, optionally :latest.
      - name: Compute tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ inputs.docker_image }}:${{ inputs.version }}"
            if [ "${{ inputs.tag_latest }}" = "true" ]; then
              echo "${{ inputs.docker_image }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 7. Publish a GitHub Release with every artifact above attached.
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # build-docker is listed as a dependency only for ordering: when it's
    # skipped (docker_image == '') the `always()`-based condition below
    # still lets this job run. `success()` on server + mac + win remains
    # required. Windows uploads live under dist/win-client/ — we scope the
    # release file patterns narrowly so that SHA256SUMS from *each* job
    # only contributes entries for *its* artifacts (they're per-platform
    # files with the same name; both get attached to the release under
    # their subdir-qualified names via the download step).
    needs: [build-server, build-mac-dmg, build-win-client, build-docker]
    if: |
      always() &&
      needs.build-server.result == 'success' &&
      needs.build-mac-dmg.result == 'success' &&
      needs.build-win-client.result == 'success' &&
      (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: server-bins
          path: dist/server/

      - name: Download mac DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac-client/

      # Windows artifacts arrive in TWO matrix-produced uploads
      # (win-client-x64 / win-client-arm64). Download each into the same
      # `dist/win-client/` directory so the [Create / update release] step
      # below sees a single flat file set. Collisions are impossible: both
      # the portable zip and the Inno Setup installer carry the arch
      # suffix in their filename (stickytodo-<ver>-windows-<arch>.zip,
      # stickytodo-setup-<ver>-<arch>.exe), and each leg's SHA256SUMS is
      # also arch-suffixed (SHA256SUMS-x64 / SHA256SUMS-arm64 — see
      # scripts/package-win-client.sh).
      - name: Download Windows client artifacts (x64)
        uses: actions/download-artifact@v4
        with:
          name: win-client-x64
          path: dist/win-client/

      - name: Download Windows client artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: win-client-arm64
          path: dist/win-client/

      - name: List artifacts (sanity check)
        run: |
          echo "=== server/ ==="
          ls -la dist/server/ || true
          echo "=== mac-client/ ==="
          ls -la dist/mac-client/ || true
          echo "=== win-client/ ==="
          ls -la dist/win-client/ || true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Note on multiple SHA256SUMS files: server / mac / win each emit
          # their own SHA256SUMS scoped to their own artifacts, and the
          # Windows build additionally splits its SHA256SUMS by arch
          # (SHA256SUMS-x64 / SHA256SUMS-arm64) so the x64 and arm64
          # matrix legs never race each other. softprops/action-gh-release
          # preserves the full source path's basename, which means
          # server's `SHA256SUMS` and mac's `SHA256SUMS` would collide at
          # upload time if we didn't keep them in separate source dirs —
          # we keep that separation via the dist/<platform>/ paths below.
          # The Windows *-x64 / *-arm64 suffixes keep the filenames unique
          # at the Release level too, so end users can `curl` the arch
          # they need without guessing which SHA256SUMS covers which zip.
          files: |
            dist/server/stickytodo-server-*
            dist/server/SHA256SUMS
            dist/mac-client/stickytodo-*-macos-universal.dmg
            dist/mac-client/SHA256SUMS
            dist/win-client/stickytodo-*-windows-x64.zip
            dist/win-client/stickytodo-*-windows-arm64.zip
            dist/win-client/stickytodo-setup-*-x64.exe
            dist/win-client/stickytodo-setup-*-arm64.exe
            dist/win-client/SHA256SUMS-x64
            dist/win-client/SHA256SUMS-arm64
