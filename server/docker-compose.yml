services:
  todo-server:
    # Build context = repo root (needed for COPY client/web/).
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: stickytodo:${VERSION:-dev}
    container_name: stickytodo
    restart: unless-stopped
    ports:
      - "${TODO_HOST_PORT:-8080}:8080"
    environment:
      # Required: fail fast if missing.
      TODO_USERNAME: ${TODO_USERNAME:?TODO_USERNAME is required}
      TODO_PASSWORD: ${TODO_PASSWORD:?TODO_PASSWORD is required}
      # NOTE: The JWT signing secret is NOT an env var anymore. On first boot the
      # server creates a 32-byte random hex and stores it in SQLite's `app_secrets`
      # table (see internal/repository/secret_repo.go). It persists across restarts
      # because /data is bind-mounted to ./data on the host.
      # Optional runtime knobs. Variable names must match internal/config exactly.
      TODO_PORT: "8080"
      TODO_DATA_DIR: "/data"
      TODO_TOKEN_TTL: ${TODO_TOKEN_TTL:-24h}
      TODO_VERBOSE: ${TODO_VERBOSE:-false}
      TODO_GIN_MODE: ${TODO_GIN_MODE:-release}
      TODO_CORS_ORIGINS: ${TODO_CORS_ORIGINS:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # The container process runs as root (alpine runtime), so the host
      # ./data directory does not need any pre-flight chown — it just works
      # whether the operator is root or a regular user. The directory is
      # auto-created by docker on first `up` if it does not yet exist.
      - ./data:/data
