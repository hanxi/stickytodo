# Sync the top-level README.md to the Docker Hub repository description.
#
# Why this exists:
#   Docker Hub's repository page has its own "Overview" body (aka
#   `full_description`) that is NOT automatically populated from the linked
#   GitHub repo. Users who `docker pull hanxi/stickytodo` land on that page
#   first, so it should stay in sync with the canonical README.md.
#
# When it runs:
#   * push to `main` that touches README.md  → auto sync
#   * workflow_dispatch                       → manual re-sync (useful after
#     rotating the Docker Hub token, or to backfill when the action was added)
#
# How it works:
#   peter-evans/dockerhub-description calls Docker Hub's
#   `PATCH /v2/repositories/{namespace}/{repo}/` with `full_description` set
#   to the README body. Docker Hub classifies this PATCH under repo admin
#   permission (NOT plain Read+Write), so the PAT used here MUST have at
#   least "Read, Write, Delete" scope (new UI) / "Admin" scope (old UI) on
#   the target repo. A Write-only token will return HTTP 403 Forbidden even
#   though login succeeds — that's the symptom we saw in the very first run.
#
# Secrets (reuses the same pair as _build-all.yml's build-docker job):
#   * DOCKERHUB_USERNAME — Docker Hub account that owns hanxi/stickytodo.
#   * DOCKERHUB_TOKEN    — PAT with admin scope ("Read, Write, Delete" in
#                          the new UI, "Admin" in the old UI). The same
#                          token is used to push images in build-docker;
#                          a plain Read+Write token will work for image
#                          push but NOT for this README PATCH — it must
#                          be upgraded to admin for both jobs to succeed.
#   If DOCKERHUB_USERNAME is missing (e.g. on a fork), the job is skipped
#   cleanly instead of failing red.
#
# Target repo:
#   `hanxi/stickytodo` — matches the image name `docker.io/hanxi/stickytodo`
#   pushed by release-tag.yml / release-branch.yml.

name: sync-dockerhub-readme

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/sync-dockerhub-readme.yml'
  workflow_dispatch:

# Read-only on repo contents; this workflow never pushes back to git.
permissions:
  contents: read

# Serialize runs so two quick README pushes don't race on the Hub API.
concurrency:
  group: sync-dockerhub-readme
  cancel-in-progress: false

jobs:
  # Tiny guard job: `secrets.*` can't be evaluated inside `if:` on the main
  # job, so we surface a boolean here and gate the real job on its output.
  # Mirrors the detect-docker-creds pattern in _build-all.yml.
  detect-docker-creds:
    name: Detect Docker Hub credentials
    runs-on: ubuntu-latest
    outputs:
      have: ${{ steps.check.outputs.have }}
    steps:
      - name: Check DOCKERHUB_USERNAME
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials available → README sync will run."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME absent → README sync will be SKIPPED."
          fi

  sync:
    name: Push README to Docker Hub
    needs: detect-docker-creds
    if: needs.detect-docker-creds.outputs.have == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extract a short description (≤100 BYTES, Hub's hard limit — not chars!)
      # from the first non-empty paragraph under the H1. README first lines
      # may contain CJK characters which are 3 bytes each in UTF-8, so char
      # truncation (${var:0:97}) lets the result overflow the byte limit and
      # the upstream action prints a warning + truncates again. We trim by
      # byte here so the action receives a value it won't need to touch.
      #
      # Implementation note: we previously used `head -c 97 | iconv -f UTF-8
      # -t UTF-8//IGNORE` to drop a partial trailing codepoint, but GNU iconv
      # on Ubuntu runners exits non-zero with "incomplete character or shift
      # sequence at end of buffer" even with //IGNORE (which only suppresses
      # "target-side unrepresentable", not "source-side truncated"). Combined
      # with `set -euo pipefail` that killed the step. BSD iconv on macOS
      # behaves differently, masking the bug locally. Now we do the UTF-8
      # boundary walk inside awk using each byte's high bits:
      #   * 0xxxxxxx         → ASCII start (safe cut point)
      #   * 11xxxxxx         → multi-byte start (safe cut point)
      #   * 10xxxxxx         → continuation (NOT safe; must walk back)
      # Zero external tools, no locale assumptions, no non-zero exit.
      #
      # If README doesn't yield a usable intro line we emit an empty output
      # and skip the short-description param entirely downstream — leaves
      # whatever was previously set on Docker Hub untouched.
      - name: Derive short description from README
        id: short
        run: |
          set -euo pipefail
          # First non-blank, non-heading, non-badge line after the H1.
          line="$(awk '
            BEGIN { seen_h1 = 0 }
            /^# / && !seen_h1 { seen_h1 = 1; next }
            seen_h1 && NF > 0 && $0 !~ /^#/ && $0 !~ /^!\[/ && $0 !~ /^\[!\[/ {
              print; exit
            }
          ' README.md || true)"
          # Trim surrounding whitespace + collapse inner runs.
          line="$(printf '%s' "$line" | tr -s ' ' | sed 's/^ *//; s/ *$//')"
          # Byte-safe truncation inside awk: keep ≤100 bytes, reserve 3 for
          # "..." if we actually cut, and never split a UTF-8 codepoint.
          # Runs under LC_ALL=C so awk's length()/substr() operate on bytes,
          # not characters — which is exactly what we need since Docker Hub's
          # limit is measured in bytes.
          line="$(printf '%s' "$line" | LC_ALL=C awk -v LIMIT=100 -v ELLIPSIS_LEN=3 '
            {
              s = $0
              n = length(s)
              if (n <= LIMIT) { print s; exit }
              # Target cut = LIMIT - ELLIPSIS_LEN. If the byte just AFTER the
              # cut is a UTF-8 continuation byte (10xxxxxx → 0x80..0xBF),
              # cutting there would strand an orphan lead byte; walk back one
              # byte at a time until the byte after the cut is a start byte
              # (ASCII 0xxxxxxx or multi-byte lead 11xxxxxx).
              cut = LIMIT - ELLIPSIS_LEN
              while (cut > 0) {
                c = substr(s, cut + 1, 1)
                ord = _ord(c)
                if (ord >= 128 && ord < 192) { cut-- } else { break }
              }
              print substr(s, 1, cut) "..."
            }
            function _ord(ch,    i) {
              if (!_ord_built) {
                for (i = 0; i < 256; i++) _ord_map[sprintf("%c", i)] = i
                _ord_built = 1
              }
              return _ord_map[ch]
            }
          ')"
          if [ -n "$line" ]; then
            echo "short=$line" >> "$GITHUB_OUTPUT"
            echo "Derived short description ($(printf '%s' "$line" | wc -c | tr -d ' ') bytes): $line"
          else
            echo "short=" >> "$GITHUB_OUTPUT"
            echo "No suitable intro line found; will leave short description unchanged."
          fi

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # DOCKERHUB_TOKEN must have admin scope on hanxi/stickytodo —
          # a plain Read+Write token yields HTTP 403 on
          # PATCH /v2/repositories/... (see file header for the full
          # explanation). The same token is consumed by build-docker for
          # image push, so upgrading it here also benefits that job.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # Must match the image name pushed by _build-all.yml's build-docker
          # job (docker.io/hanxi/stickytodo). Keep these in sync.
          repository: hanxi/stickytodo
          readme-filepath: ./README.md
          # Only set short-description when we actually derived one, so the
          # action leaves the existing value alone on empty input.
          short-description: ${{ steps.short.outputs.short }}
          enable-url-completion: true
