<?xml version="1.0" encoding="UTF-8"?>
<!--
  StickyTodo Menu Bar Template Image (18×18pt viewbox)
  ────────────────────────────────────────────────────
  macOS menu bar icons MUST be TEMPLATE images:
    - Black pixels (#000000) + alpha only (NO color, NO gradients)
    - The system tints them automatically based on menu bar
      light/dark mode and selected state
    - Optical size is ~18×18pt; at @1x that's just 18 pixels square,
      so every stroke has to be thick enough to survive

  Design: simplified sticky note with folded corner + a checkmark
  inside. Bold silhouettes only; no thin strokes, no fill gradients.

  Rasterized to @1x (18px), @2x (36px), @3x (54px) by
  scripts/generate-icons.sh and dropped into
  client/mac/stickytodo/Assets.xcassets/MenuBarIcon.imageset/.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"
     role="img" aria-label="StickyTodo menu bar icon">
  <title>StickyTodo</title>

  <!-- Paint everything in pure black; alpha carries the shape. -->
  <g fill="#000000" fill-rule="evenodd">

    <!-- Outer sticky note silhouette with a folded bottom-right corner.
         Coordinates chosen so visible weight is evenly distributed around
         the 18×18 box with ~1.5pt padding on each side.
         Path reading:
           M 2 2            top-left
           H 13             top edge to 13
           L 16 5           diagonal in (implying a fold)
           V 16             right edge down
           Q 16 16 15.5 16  tiny rounded bottom-right
           H 2              bottom edge back
           Q 2 16 2 15.5    bottom-left rounded
           V 2
           Z
         The "fold" is the diagonal cut between (13,2)→(16,5); we punch
         it out with a separate triangle clipped as a sub-path below. -->
    <path d="
      M 3 2
      H 12.5
      L 16 5.5
      V 15
      Q 16 16 15 16
      H 3
      Q 2 16 2 15
      V 3
      Q 2 2 3 2
      Z
      M 12.5 3.4
      H 4
      Q 3.2 3.4 3.2 4.2
      V 14.6
      Q 3.2 14.8 3.4 14.8
      H 14.6
      Q 14.8 14.8 14.8 14.6
      V 6.5
      H 13
      Q 12.5 6.5 12.5 6
      Z
      "/>

    <!-- Fold highlight: a small triangle at the corner so the folded
         surface reads as a separate plane even when the whole icon is
         monochrome. Drawn as a filled triangle just below the fold line. -->
    <path d="
      M 13 6.5
      H 16
      L 13 3.5
      Z
      "/>

    <!-- Checkmark inside the note. A thick stroke (≈1.8pt) drawn as a
         filled parallelogram-ish path so it survives alpha rounding at 18px.
         We use <path> instead of <polyline stroke> because stroke widths
         get aliased unevenly when rasterized very small. -->
    <path d="
      M 5.2 9.3
      L 6.3 8.2
      L 7.9 9.8
      L 11.1 6.6
      L 12.2 7.7
      L 7.9 12.0
      Z
      "/>

  </g>
</svg>
